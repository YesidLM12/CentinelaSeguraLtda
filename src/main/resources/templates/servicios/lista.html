<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf_header" content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/css/loginStyle.css}">
    <title>Lista de Servicios</title>
</head>

<body>
    <div class="container-servicios-lista">
        <section>
            <div th:replace="~{fragments/fragmentos :: navbar}"></div>
        </section>
        <main class="container-tabla-servicios">
            <div class="container-titulo">
                <h1>Servicios</h1>

                <button type="button" th:action="@{/servicios/crear}" sec:authorize="hasRole('ADMINISTRADOR')"
                    class="btn-login">
                    <a th:href="@{/servicios/crear}">Nuevo Servicio</a>
                </button>
            </div>

            <div class="tabla-container">
                <form th:object="${filtro}" th:action="@{/servicios}" method="get" class="filtros">

                    <div class="campo">
                        <label for="modalidad">Modalidad</label>
                        <select id="modalidad" th:field="*{modalidad}">
                            <option value="">Todas las modalidades</option>
                            <option
                                th:each="modalidad : ${T(org.yesidl12.centinelaseguraltda.enums.Modalidad).values()}"
                                th:value="${modalidad}" th:text="${modalidad}"></option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="ubicacion">Ubicación</label>
                        <input id="ubicacion" type="text" th:field="*{ubicacion}" placeholder="Ej. Laureles">
                    </div>

                    <div class="campo">
                        <label for="tarifaMin">Tarifa mínima</label>
                        <input id="tarifaMin" type="number" th:field="*{tarifaMin}" min="0" step="0.01">
                    </div>

                    <div class="campo">
                        <label for="tarifaMax">Tarifa máxima</label>
                        <input id="tarifaMax" type="number" th:field="*{tarifaMax}" min="0" step="0.01">
                    </div>

                    <div class="campo">
                        <label for="duracionMin">Duración mín. (d)</label>
                        <input id="duracionMin" type="number" th:field="*{duracionMin}" min="0">
                    </div>

                    <div class="campo">
                        <label for="duracionMax">Duración máx. (d)</label>
                        <input id="duracionMax" type="number" th:field="*{duracionMax}" min="0">
                    </div>

                    <div class="acciones">
                        <button type="submit">Buscar</button>
                        <a th:href="@{/servicios}" class="boton-secundario">Limpiar</a>
                    </div>
                </form>

                <table id="tabla-servicios">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Modalidad</th>
                            <th>Medio</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Duración (días)</th>
                            <th>Activo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="servicio : ${servicios}">
                            <td th:text="${servicio.nombre()}"></td>
                            <td th:text="${servicio.modalidad()}"></td>
                            <td th:text="${servicio.medio()}"></td>
                            <td th:text="${servicio.descripcion()}"></td>
                            <td th:text="${servicio.tarifa()}"></td>
                            <td th:text="${servicio.duracionDias()}"></td>
                            <td th:text="${servicio.activo()}"></td>
                            <td>
                                <div class="action-button">
                                    <button sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-accion">
                                        <a th:href="@{/servicios/actualizar/{id}(id=${servicio.id()})}">Editar</a>
                                    </button>
                                    <button sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-accion">
                                        <form th:action="@{/servicios/{id}(id=${servicio.id()})}" method="post"
                                            onsubmit="return confirm('¿Eliminar este servicio?');">
                                            <button type="submit" class="btn btn-peligro">Eliminar</button>
                                        </form>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination-container">
                    <p th:if="${servicios.isEmpty()}">No hay servicios registrados</p>

                    <a class="pagination-button" th:if="${servicios.hasPrevious()}"
                        th:href="@{/servicios(page=${servicios.number - 1})}">Anterior</a>

                    <p th:if="${!servicios.isEmpty()}">
                        Mostrando página <span th:text="${servicios.number + 1}"></span>
                        de <span th:text="${servicios.totalPages}"></span>
                    </p>

                    <a class="pagination-button" th:if="${servicios.hasNext()}"
                        th:href="@{/servicios(page=${servicios.number + 1})}">Siguiente</a>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
