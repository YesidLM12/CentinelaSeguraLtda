<!DOCTYPE html>
<html lang="es" xmlns:xsi="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/loginStyle.css}">
    <title>Crear Equipo</title>
</head>

<body>
    <div class="formulario-container">
        <div class="formulario-subcontainer">
            <form th:action="@{/personal-equipo/equipos}" method="post" class="formulario-registrar-personal">
                <h1>Crear Equipo</h1>

                <div class="campo-formulario">
                    <label class="label">Tipo</label>
                    <select class="label-input" name="tipo" required>
                        <option value="">Seleccione un tipo</option>
                        <option th:each="tipo : ${T(org.yesidl12.centinelaseguraltda.enums.Tipo_Equipo).values()}"
                            th:value="${tipo}" th:text="${tipo}"></option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label class="label">Descripción</label>
                    <input class="label-input" type="text" name="descripcion" placeholder="Descripción" required>
                </div>

                <div class="campo-formulario">
                    <label class="label">Marca</label>
                    <input class="label-input" type="text" name="marca" placeholder="Marca" required>
                </div>

                <div class="campo-formulario">
                    <label class="label">Número de Permiso</label>
                    <input class="label-input" type="text" name="numeroPermiso" placeholder="Número de Permiso"
                        required>
                </div>

                <div class="campo-formulario">
                    <label class="label">Estado</label>
                    <select class="label-input" name="estado" required>
                        <option value="">Seleccione un estado</option>
                        <option th:each="estado : ${T(org.yesidl12.centinelaseguraltda.enums.Estado_Equipo).values()}"
                            th:value="${estado}" th:text="${estado}"></option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label class="label">Ubicación</label>
                    <input class="label-input" type="text" name="ubicacion" placeholder="Ubicación" required>
                </div>
                <div class="campo-formulario">
                    <label class="label">Fecha de Adquisición</label>
                    <input class="label-input" type="date" name="fechaAdquision" placeholder="Fecha de Adquisición"
                        required>
                </div>

                <button type="submit" class="btn-login">Guardar</button>
            </form>
        </div>
    </div>
</body>

</html>
