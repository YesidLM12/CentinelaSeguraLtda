<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf_header" content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/css/loginStyle.css}">
    <title>Lista de Entrenamientos</title>
</head>
<body>
    <div class="container-entrenamientos-lista">
        <section>
            <div th:replace="~{fragments/fragmentos :: navbar}"></div>
        </section>
        <main class="container-tabla-entrenamientos">
            <div class="container-titulo">
                <h1>Entrenamientos</h1>

                <button type="button" th:action="@{/entrenamientos/crear}" sec:authorize="hasRole('ADMINISTRADOR')"
                    class="btn-login">
                    <a th:href="@{/entrenamientos/crear}">Nuevo Entrenamiento</a>
                </button>
            </div>

            <div class="tabla-container">
                <table id="tabla-entrenamientos">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Descripción</th>
                            <th>Contenido</th>
                            <th>Intensidad (horas)</th>
                            <th>Costo</th>
                            <th>Cupo máximo</th>
                            <th>Fecha inicio</th>
                            <th>Fecha fin</th>
                            <th>Hora inicio</th>
                            <th>Hora fin</th>
                            <th>Lugar</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entrenamiento : ${entrenamientos}">
                            <td th:text="${entrenamiento.nombre}"></td>
                            <td th:text="${entrenamiento.tipo}"></td>
                            <td th:text="${entrenamiento.descripcion}"></td>
                            <td th:text="${entrenamiento.contenido}"></td>
                            <td th:text="${entrenamiento.intensidadHoras}"></td>
                            <td th:text="${entrenamiento.costo}"></td>
                            <td th:text="${entrenamiento.cupoMaximo}"></td>
                            <td th:text="${entrenamiento.fechaInicio}"></td>
                            <td th:text="${entrenamiento.fechaFin}"></td>
                            <td th:text="${entrenamiento.horaInicio}"></td>
                            <td th:text="${entrenamiento.horaFin}"></td>
                            <td th:text="${entrenamiento.lugar}"></td>
                            <td th:text="${entrenamiento.estado}"></td>
                            <td>
                                <div class="action-button">
                                    <button sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-accion">
                                        <a th:href="@{/entrenamientos/actualizar/{id}(id=${entrenamiento.id})}">Editar</a>
                                    </button>
                                    <button sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-accion">
                                        <form th:action="@{/entrenamientos/{id}(id=${entrenamiento.id})}" method="post"
                                            onsubmit="return confirm('¿Eliminar este entrenamiento?');">
                                            <button type="submit" class="btn btn-peligro">Eliminar</button>
                                        </form>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                 <div class="pagination-container">
                    <p th:if="${entrenamientos.isEmpty()}">No hay entrenamientos registrados</p>

                    <a class="pagination-button" th:if="${entrenamientos.hasPrevious()}"
                        th:href="@{/entrenamientos(page=${entrenamientos.number - 1})}">Anterior</a>

                    <p th:if="${!entrenamientos.isEmpty()}">
                        Mostrando página <span th:text="${entrenamientos.number + 1}"></span>
                        de <span th:text="${entrenamientos.totalPages}"></span>
                    </p>

                    <a class="pagination-button" th:if="${entrenamientos.hasNext()}"
                        th:href="@{/entrenamientos(page=${entrenamientos.number + 1})}">Siguiente</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
