<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="_csrf" content="${_csrf.token}" />
    <meta name="_csrf_header" content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/css/loginStyle.css}">
    <script th:src="@{/js/usuarios.js}" defer></script>

    <title>Lista de Usuarios</title>
</head>

<body>
    <div class="container-usuarios-lista">
        <section>
            <div th:replace="~{fragments/fragmentos :: navbar}"></div>
        </section>

        <main class="container-tabla-usuarios">
            <div class="container-titulo">
                <h1>Usuarios</h1>

                <button type="button" th:action="@{/usuarios/crear}" sec:authorize="hasRole('ADMINISTRADOR')"
                    class="btn-login">
                    <a th:href="@{/usuarios/crear}">Nuevo Usuario</a>
                </button>
            </div>

            <div class="tabla-container">
                <table id="tabla-usuarios">
                    <thead>
                        <tr>
                            <th>Documento</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Activo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td th:text="${usuario.documento()}"></td>
                            <td th:text="${usuario.nombre()}"></td>
                            <td th:text="${usuario.correo()}"></td>
                            <td th:text="${usuario.rol()}"></td>
                            <td th:text="${usuario.activo()}"></td>
                            <td>

                                <div class="action-button">
                                    <button sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-accion">
                                        <a th:href="@{/usuarios/actualizar/{id}(id=${usuario.documento()})}">Editar</a>
                                    </button>

                                    <button sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-accion">
                                        <form
                                            th:action="@{/usuarios/eliminar/{documento}(documento=${usuario.documento()})}"
                                            method="post" onsubmit="return confirm('¿Eliminar este usuario?');">
                                            <button type="submit" class="btn btn-peligro">Eliminar</button>
                                        </form>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination-container">
                    <p th:if="${usuarios.isEmpty()}">No hay usuarios registrados</p>

                    <a class="pagination-button" th:if="${usuarios.hasPrevious()}"
                        th:href="@{/usuarios(page=${usuarios.number - 1})}">Anterior</a>

                    <p th:if="${!usuarios.isEmpty()}">
                        Mostrando página <span th:text="${usuarios.number + 1}"></span>
                        de <span th:text="${usuarios.totalPages}"></span>
                    </p>

                    <a class="pagination-button" th:if="${usuarios.hasNext()}"
                        th:href="@{/usuarios(page=${usuarios.number + 1})}">Siguiente</a>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
