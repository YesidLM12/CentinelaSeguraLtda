<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf_header" content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/css/loginStyle.css}">
    <title>Lista de Clientes</title>
</head>

<body>
    <div class="container-clientes-lista">
        <section>
            <div th:replace="~{fragments/fragmentos :: navbar}"></div>
        </section>
        <main class="container-tabla-clientes">
            <div class="container-titulo">
                <h1>Clientes</h1>

                <button type="button" th:action="@{/clientes/crear}" sec:authorize="hasRole('ADMINISTRADOR')"
                    class="btn-login">
                    <a th:href="@{/clientes/crear}">Nuevo Cliente</a>
                </button>
            </div>

            <div class="tabla-container">
                <table id="tabla-clientes">
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Nombre / Razón Social</th>
                            <th>Representante Legal</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Ciudad</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.getTipo()}"></td>
                            <td th:text="${cliente.getNombreRazonSocial()}"></td>
                            <td th:text="${cliente.getRepresentanteLegal()}"></td>
                            <td th:text="${cliente.getCorreo()}"></td>
                            <td th:text="${cliente.getTelefono()}"></td>
                            <td th:text="${cliente.getDireccion()}"></td>
                            <td th:text="${cliente.getCiudad()}"></td>
                            <td th:text="${cliente.getObservaciones()}"></td>
                            <td>
                                <div class="action-button">
                                    <button sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-accion">
                                        <a th:href="@{/clientes/actualizar/{id}(id=${cliente.getId()})}">Editar</a>
                                    </button>
                                    <button sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-accion">
                                        <form th:action="@{/clientes/{id}(id=${cliente.id})}" method="post"
                                            onsubmit="return confirm('¿Eliminar este cliente?');">
                                            <button type="submit" class="btn btn-peligro">Eliminar</button>
                                        </form>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination-container">
                    <p th:if="${clientes.isEmpty()}">No hay clientes registrados</p>

                    <a class="pagination-button" th:if="${clientes.hasPrevious()}"
                        th:href="@{/clientes(page=${clientes.number - 1})}">Anterior</a>

                    <p th:if="${!clientes.isEmpty()}">
                        Mostrando página <span th:text="${clientes.number + 1}"></span>
                        de <span th:text="${clientes.totalPages}"></span>
                    </p>

                    <a class="pagination-button" th:if="${clientes.hasNext()}"
                        th:href="@{/clientes(page=${clientes.number + 1})}">Siguiente</a>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
