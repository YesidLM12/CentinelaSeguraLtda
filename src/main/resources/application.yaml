spring:
  profiles:
    active: dev
  debug: true

  application:
    name: centinela
  
  thymeleaf:
    cache: false

  datasource:
    url: jdbc:h2:file:./data/centinela
    username: sa
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  messages:
    basename: messages

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000

logging:
  level:
    root: DEBUG
    com:
      yesidl12:
        centinelaseguraltda: DEBUG

  org:
    springframework: INFO
    hibernate: ERROR


server:
  servlet:
    session:
      timeout: 30m